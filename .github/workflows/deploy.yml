name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Pages base URL
        shell: python
        run: |
          import os
          from pathlib import Path

          owner, repository = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          path = "" if repository.lower() == f"{owner.lower()}.github.io" else f"/{repository}"
          base_url = f"{owner}.github.io{path}"
          config_path = Path("quartz.config.yaml")
          config = config_path.read_text(encoding="utf-8")
          config = config.replace("example.github.io/personal-homepage", base_url)
          config_path.write_text(config, encoding="utf-8")
          print(f"Using baseUrl: {base_url}")

      - name: Build site
        env:
          QUARTZ_PROTOTYPE: "0"
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
